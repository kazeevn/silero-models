name: Android TTS APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android_tts.yml'
  workflow_dispatch:
    inputs:
      release:
        description: Publish the APK as a GitHub release
        type: boolean
        default: false

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # for the optional GitHub release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.*"
          pip install -r tools/requirements.txt
          # LiteRT C API for the Kotlin tests (same runtime as the app)
          LITERT_DIR=$(python -c 'import importlib.util; print(importlib.util.find_spec("ai_edge_litert").submodule_search_locations[0])')
          echo "LITERT_LIB=$LITERT_DIR/libLiteRt.so" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: android/build/v5_5_ru.pt
          key: silero-v5_5_ru-package

      - name: Convert the networks with LiteRT Torch
        run: python tools/export_models.py --package build/v5_5_ru.pt --out build/silero-export

      - name: Verify the LiteRT pipeline against the original package
        run: python tools/reference_pipeline.py --assets build/silero-export --compare build/v5_5_ru.pt

      - name: Build APK model assets (fp32 weights)
        run: python tools/optimize_models.py --src build/silero-export --out app/src/main/assets/silero

      - name: Write Kotlin test vectors
        run: python tools/reference_pipeline.py --assets app/src/main/assets/silero --vectors build/vectors.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Engine tests (Kotlin vs reference pipeline)
        run: ./gradlew :core:test -Psilero.assets=$PWD/app/src/main/assets/silero -Psilero.litert=$LITERT_LIB -Psilero.vectors=$PWD/build/vectors.json

      - name: Release keystore
        env:
          KEYSTORE_B64: ${{ secrets.SILERO_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APK
        env:
          SILERO_KEYSTORE: ${{ runner.temp }}/release.jks
          SILERO_KEYSTORE_PASSWORD: ${{ secrets.SILERO_KEYSTORE_PASSWORD }}
          SILERO_KEY_ALIAS: ${{ secrets.SILERO_KEY_ALIAS }}
          SILERO_KEY_PASSWORD: ${{ secrets.SILERO_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:lintRelease

      - uses: actions/upload-artifact@v4
        with:
          name: silero-tts-v5_5_ru-arm64
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Created with the workflow token, so the tag does not trigger other
      # workflows (build_deploy.yml publishes to PyPI on ref creation).
      - name: Publish GitHub release
        if: inputs.release || contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          TAG="android-tts-$VERSION"
          APK="silero-tts-v5_5_ru-arm64-android17.apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$APK"
          SHA=$(sha256sum "$RUNNER_TEMP/$APK" | cut -d' ' -f1)
          CERT=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Offline Android system text-to-speech engine running [Silero](https://github.com/snakers4/silero-models) \`v5_5_ru\` on-device with [LiteRT](https://ai.google.dev/edge/litert): the networks are converted from PyTorch with [AI Edge Torch / LiteRT Torch](https://github.com/google-ai-edge/litert-torch) and run on the CPU with XNNPACK. 5 Russian voices (xenia, baya, kseniya, aidar, eugene), automatic stress and homographs, Russian text normalization.

          Built for a Pixel 8a on Android 17: arm64-v8a only, minSdk 37. See [android/README.md](https://github.com/${{ github.repository }}/blob/$GITHUB_SHA/android/README.md) for details and measurements.

          **Install:** \`adb install $APK\` (or open the file on the phone), then pick *Silero TTS (ru)* in Settings → System → Languages → Text-to-speech output → Preferred engine.

          - APK SHA-256: \`$SHA\`
          - Signing certificate SHA-256: \`$CERT\`

          The model is licensed under CC BY-NC-SA 4.0 (non-commercial use only).
          NOTES
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$APK" --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" "$RUNNER_TEMP/$APK" --target "$GITHUB_SHA" \
              --title "Silero TTS v5_5_ru for Android $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
